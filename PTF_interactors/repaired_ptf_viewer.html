<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация PTF структур</title>
    <script src="https://cdn.jsdelivr.net/npm/ngl@2.0.0-dev.37/dist/ngl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 20px;
        }

        .structure-list {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
            max-height: 800px;
            overflow-y: auto;
        }

        .structure-list h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            position: sticky;
            top: 0;
            background: white;
            padding-bottom: 10px;
            z-index: 10;
        }

        .protein-group {
            margin-bottom: 20px;
        }

        .protein-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .protein-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .protein-header.sox2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .protein-header.oct4 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .protein-header.klf4 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .protein-title {
            font-weight: 600;
            font-size: 1.1em;
        }

        .protein-count {
            background: rgba(255, 255, 255, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .collapse-icon {
            transition: transform 0.3s ease;
        }

        .protein-header.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .structures-container {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .structures-container.collapsed {
            max-height: 0;
        }

        /* Table styles */
        .structures-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .structures-table th {
            background: #f8f9fa;
            padding: 10px 8px;
            text-align: left;
            font-size: 0.85em;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #dee2e6;
        }

        .structures-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #dee2e6;
            font-size: 0.9em;
        }

        .structures-table tbody tr {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .structures-table tbody tr:hover {
            background: #f8f9fa;
        }

        .structures-table tbody tr.active {
            background: #667eea;
            color: white;
        }

        .structures-table tbody tr.active td {
            border-bottom-color: #764ba2;
        }

        .view-btn {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85em;
        }

        .structures-table tbody tr.active .view-btn {
            background: white;
            color: #667eea;
        }

        .structures-table tbody tr:hover .view-btn {
            transform: scale(1.1);
        }

        .gene-cell {
            font-weight: 600;
        }

        .uniprot-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #666;
        }

        .structures-table tbody tr.active .uniprot-cell {
            color: rgba(255, 255, 255, 0.9);
        }

        .pdb-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #999;
        }

        .structures-table tbody tr.active .pdb-cell {
            color: rgba(255, 255, 255, 0.7);
        }

        .viewer-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #viewport {
            width: 100%;
            height: 600px;
            border-radius: 10px;
            background: #000;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .info-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .structure-list {
                max-height: none;
            }
        }
    </style>
</head>

                <div class="controls">

        // ========== ОТРИСОВКА СПИСКА ==========
        function renderStructureList() {
            const listContainer = document.getElementById('structureList');
            let globalIndex = 0;
            
            Object.keys(structuresByProtein).forEach(proteinKey => {
                const structures = structuresByProtein[proteinKey];
                const proteinName = proteinNames[proteinKey];
                
                if (structures.length === 0) return;
                
                // Создаём группу для белка
                const groupDiv = document.createElement('div');
                groupDiv.className = 'protein-group';
                
                // Заголовок группы
                const headerDiv = document.createElement('div');
                headerDiv.className = `protein-header ${proteinKey}`;
                headerDiv.innerHTML = `
                    <div class="protein-title">🧬 ${proteinName}</div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="protein-count">${structures.length}</span>
                        <span class="collapse-icon">▼</span>
                    </div>
                `;
                
                // Контейнер для таблицы
                const containerDiv = document.createElement('div');
                containerDiv.className = 'structures-container';
                
                // Создаём таблицу
                const table = document.createElement('table');
                table.className = 'structures-table';
                
                // Заголовок таблицы
                const thead = document.createElement('thead');
                thead.innerHTML = `
                    <tr>
                        <th style="width: 45px;">View</th>
                        <th>Gene</th>
                        <th>UniProt</th>
                        <th style="width: 100px;">PDB</th>
                    </tr>
                `;
                table.appendChild(thead);
                
                // Тело таблицы
                const tbody = document.createElement('tbody');
                
                structures.forEach((struct, localIndex) => {
                    const row = document.createElement('tr');
                    row.dataset.index = globalIndex;
                    row.dataset.protein = proteinKey;
                    
                    row.innerHTML = `
                        <td><div class="view-btn">👁</div></td>
                        <td class="gene-cell">${struct.gene || struct.name.split(' - ')[1] || 'Unknown'}</td>
                        <td class="uniprot-cell">${struct.uniprot || '-'}</td>
                        <td class="pdb-cell">${struct.pdbFile.split('_').slice(0,2).join('_')}</td>
                    `;
                    
                    row.onclick = () => loadStructure(globalIndex, proteinKey);
                    tbody.appendChild(row);
                    globalIndex++;
                });
                
                table.appendChild(tbody);
                containerDiv.appendChild(table);
                
                // Обработчик сворачивания/разворачивания
                headerDiv.onclick = function() {
                    this.classList.toggle('collapsed');
                    containerDiv.classList.toggle('collapsed');
                };
                
                groupDiv.appendChild(headerDiv);
                groupDiv.appendChild(containerDiv);
                listContainer.appendChild(groupDiv);
            });

            // Загрузить первую структуру по умолчанию
            const firstProtein = Object.keys(structuresByProtein).find(
                key => structuresByProtein[key].length > 0
            );
            if (firstProtein) {
                loadStructure(0, firstProtein);
            }
        }

        // ========== ЗАГРУЗКА СТРУКТУРЫ ==========
        function loadStructure(globalIndex, proteinKey) {
            // Найти структуру по глобальному индексу
            let currentGlobalIndex = 0;
            let struct = null;
            
            for (const protein of Object.keys(structuresByProtein)) {
                const structures = structuresByProtein[protein];
                if (globalIndex < currentGlobalIndex + structures.length) {
                    struct = structures[globalIndex - currentGlobalIndex];
                    break;
                }
                currentGlobalIndex += structures.length;
            }
            
            if (!struct) return;
            
            // Обновить активную строку в таблице
            document.querySelectorAll('.structures-table tbody tr').forEach((row) => {
                if (parseInt(row.dataset.index) === globalIndex) {
                    row.classList.add('active');
                } else {
                    row.classList.remove('active');
                }
            });

            // Очистить текущую структуру
            stage.removeAllComponents();

            // Загрузить новую структуру
            stage.loadFile(`repaired_structures/${struct.pdbFile}`)
                .then(function(component) {
                    currentStructure = component;
                    component.addRepresentation("cartoon", {
                        color: "chainindex"
                    });
                    component.autoView();
                })
                .catch(function(error) {
                    console.error("Ошибка загрузки структуры:", error);
                    alert(`Не удалось загрузить ${struct.pdbFile}.\nПроверьте:\n1. Файл находится в папке repaired_structures/\n2. Имя файла написано правильно`);
                });
        }

        // ========== УПРАВЛЕНИЕ ВИЗУАЛИЗАЦИЕЙ ==========
        function toggleSpin() {
            spinning = !spinning;
            stage.setSpin(spinning);
        }

        function changeRepresentation(type) {
            if (!currentStructure) return;
            
            currentStructure.removeAllRepresentations();
            currentStructure.addRepresentation(type, {
                color: "chainindex"
            });
        }

        function downloadPDB() {
            const activeRow = document.querySelector('.structures-table tbody tr.active');
            if (!activeRow) return;
            
            const globalIndex = parseInt(activeRow.dataset.index);
            let currentGlobalIndex = 0;
            let struct = null;
            
            for (const protein of Object.keys(structuresByProtein)) {
                const structures = structuresByProtein[protein];
                if (globalIndex < currentGlobalIndex + structures.length) {
                    struct = structures[globalIndex - currentGlobalIndex];
                    break;
                }
                currentGlobalIndex += structures.length;
            }
            
            if (struct) {
                window.open(`repaired_structures/${struct.pdbFile}`, '_blank');
            }
        }
    </script>
</body>
</html>
